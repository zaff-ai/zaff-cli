name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # all history and branches, so origin/main is here to check against
          persist-credentials: false
      # Publish only reviewed code: a manual run must be on main, and a
      # release must tag a commit that is already on main. (The 'pypi'
      # environment's required reviewer and branch rules are the other half;
      # they're repo settings.)
      - name: Only main, or a tag on main
        run: |
          case "$GITHUB_REF" in
            refs/heads/main) ;;
            refs/tags/*)
              git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
                || { echo "::error::tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; } ;;
            *) echo "::error::publish runs only from main or a release tag on main, not $GITHUB_REF"; exit 1 ;;
          esac
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build
        run: python -m pip install --upgrade build
      - name: Build sdist and wheel
        run: python -m build
      # Refuse to publish anything but 'zaff' at the version in pyproject.toml,
      # and show exactly what ships.
      - name: Check it is zaff and list what ships
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          name=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          [ "$name" = zaff ] || { echo "::error::project name is '$name', not 'zaff'"; exit 1; }
          expected="zaff-$version-py3-none-any.whl zaff-$version.tar.gz"
          actual=$(find dist -maxdepth 1 -type f -printf '%f\n' | sort | xargs)
          [ "$actual" = "$expected" ] || { echo "::error::dist is '$actual', expected '$expected'"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::release tag $GITHUB_REF_NAME doesn't match pyproject version v$version"; exit 1
          fi
          tar tzf "dist/zaff-$version.tar.gz"
          unzip -l "dist/zaff-$version-py3-none-any.whl"
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/zaff/
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
