[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zaff"
version = "0.1.1"
description = "Zaff CLI — your personal knowledge graph from the command line"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Nolan Love", email = "nolanlove@yahoo.com" }
]
keywords = ["zaff", "memory", "knowledge-graph", "mcp", "ai-agents", "cli"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13",
    "keyring>=24",
]

[project.urls]
Homepage = "https://zaff.ai"
Repository = "https://github.com/zaff-ai/zaff-cli"

[project.scripts]
zaff = "zaff.__main__:main"

# Only the current package ships: an explicit list, so nothing else in the
# repo (workflows, local files, build leftovers) can end up in a release.
# (hatchling always adds .gitignore to the sdist as well.)
[tool.hatch.build.targets.wheel]
packages = ["src/zaff"]

[tool.hatch.build.targets.sdist]
include = ["src/zaff/*.py", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["**/__pycache__", "**/*.pyc"]
